<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTSランキング ダッシュボード</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">📈</span>
                    <h1>PTSランキング</h1>
                </div>
                <nav class="header-nav" style="display:flex;gap:4px;">
                    <a href="/"
                        style="padding:8px 16px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500;background:var(--primary-color);color:white;">📈
                        PTSランキング</a>
                    <a href="/trending"
                        style="padding:8px 16px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500;color:var(--text-light);">🔥
                        話題株</a>
                    <a href="/screening"
                        style="padding:8px 16px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500;color:var(--text-light);">🔍
                        スクリーニング</a>
                    <a href="/signals"
                        style="padding:8px 16px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500;color:var(--text-light);">📡
                        シグナル監視</a>
                    <a href="/earnings"
                        style="padding:8px 16px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500;color:var(--text-light);">📈
                        決算インパクト</a>
                    <a href="/quant"
                        style="padding:8px 16px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500;color:var(--text-light);">🧪
                        クオンツ分析</a>
                </nav>
                <div class="header-actions" style="display:flex;gap:8px;">
                    <button class="btn btn-primary" onclick="fetchJQuantsRanking()"
                        style="background:linear-gradient(135deg,#10b981,#059669);">
                        <span class="btn-icon">📊</span>
                        J-Quantsランキング
                    </button>
                    <button class="btn btn-primary" onclick="fetchNewData()">
                        <span class="btn-icon">🔄</span>
                        データ更新
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-info">
                        <div class="stat-label">平均上昇率</div>
                        <div class="stat-value" id="avgChangeRate">--</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">🚀</div>
                    <div class="stat-info">
                        <div class="stat-label">最大上昇率</div>
                        <div class="stat-value" id="maxChangeRate">--</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <div class="stat-label">総出来高</div>
                        <div class="stat-value" id="totalVolume">--</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">📈</div>
                    <div class="stat-info">
                        <div class="stat-label">対象銘柄数</div>
                        <div class="stat-value" id="totalStocks">--</div>
                    </div>
                </div>
            </div>




            <!-- Rankings Table -->
            <div class="table-card">
                <div class="card-header">
                    <h3>📋 最新PTSランキング</h3>
                    <div class="last-updated">
                        最終更新: <span id="lastUpdated">--</span>
                    </div>
                </div>
                <div class="card-body">
                    <div id="loadingIndicator" class="loading">
                        <div class="spinner"></div>
                        <p>データを読み込み中...</p>
                    </div>
                    <div id="rankingTable" style="display: none;">
                        <table class="ranking-table">
                            <thead>
                                <tr>
                                    <th>順位</th>
                                    <th>評価</th>
                                    <th>コード</th>
                                    <th>銘柄名</th>
                                    <th>PTS価格</th>
                                    <th>変化率</th>
                                    <th>PER</th>
                                    <th>PBR</th>
                                    <th>出来高</th>
                                    <th>上昇理由</th>
                                    <th>詳細</th>
                                </tr>
                            </thead>
                            <tbody id="rankingTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Stock Detail Modal -->
    <div id="stockModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalStockName">--</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="modalContent">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>詳細情報を読み込み中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>

</html>
