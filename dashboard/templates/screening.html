<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銘柄スクリーニング | PTSランキング</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/screening.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ナビゲーション -->
    <header class="nav-header">
        <div class="nav-container">
            <h1 class="nav-title">📊 PTSランキング</h1>
            <nav class="nav-links">
                <a href="/" class="nav-link">📊 PTSランキング</a>
                <a href="/trending" class="nav-link">🔥 話題株</a>
                <a href="/screening" class="nav-link active">🔍 スクリーニング</a>
            </nav>
        </div>
    </header>

    <!-- フィルターパネル -->
    <div class="filter-panel">
        <div class="filter-container">

            <!-- 行1: 市場・業種・株価・出来高 -->
            <div class="filter-row">
                <div class="filter-group">
                    <label>市場区分</label>
                    <select id="marketFilter">
                        <option value="">全市場</option>
                        <option value="プライム">プライム</option>
                        <option value="スタンダード">スタンダード</option>
                        <option value="グロース">グロース</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>業種</label>
                    <select id="sectorFilter">
                        <option value="">全業種</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>株価（円）</label>
                    <div class="range-inputs">
                        <input type="number" id="priceMin" placeholder="下限" min="0" step="1">
                        <span>〜</span>
                        <input type="number" id="priceMax" placeholder="上限" min="0" step="1">
                    </div>
                </div>

                <div class="filter-group">
                    <label>前日比（%）</label>
                    <div class="range-inputs">
                        <input type="number" id="changeMin" placeholder="下限" step="0.1">
                        <span>〜</span>
                        <input type="number" id="changeMax" placeholder="上限" step="0.1">
                    </div>
                </div>

                <div class="filter-group">
                    <label>出来高（最低）</label>
                    <select id="volumeMin">
                        <option value="">指定なし</option>
                        <option value="10000">1万株以上</option>
                        <option value="100000">10万株以上</option>
                        <option value="500000">50万株以上</option>
                        <option value="1000000">100万株以上</option>
                        <option value="5000000">500万株以上</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>売買代金（最低）</label>
                    <select id="turnoverMin">
                        <option value="">指定なし</option>
                        <option value="10000000">1,000万円以上</option>
                        <option value="100000000">1億円以上</option>
                        <option value="500000000">5億円以上</option>
                        <option value="1000000000">10億円以上</option>
                        <option value="5000000000">50億円以上</option>
                    </select>
                </div>
            </div>

            <!-- 行2: ソート・件数・ボタン -->
            <div class="filter-row">
                <div class="filter-group">
                    <label>並び替え</label>
                    <select id="sortBy">
                        <option value="turnover">売買代金（多い順）</option>
                        <option value="volume">出来高（多い順）</option>
                        <option value="change_rate_desc">前日比（高い順）</option>
                        <option value="change_rate_asc">前日比（低い順）</option>
                        <option value="close_desc">株価（高い順）</option>
                        <option value="close_asc">株価（安い順）</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>表示件数</label>
                    <select id="limitFilter">
                        <option value="50">50件</option>
                        <option value="100" selected>100件</option>
                        <option value="200">200件</option>
                        <option value="500">500件</option>
                    </select>
                </div>

                <div class="filter-group filter-actions">
                    <button id="searchBtn" class="btn-search" onclick="runScreening()">
                        🔍 スクリーニング実行
                    </button>
                    <button id="resetBtn" class="btn-reset" onclick="resetFilters()">
                        ↺ リセット
                    </button>
                </div>
            </div>

            <!-- プリセット -->
            <div class="preset-row">
                <span class="preset-label">クイック:</span>
                <button class="preset-btn" onclick="applyPreset('surge')">🚀 急騰株（+5%↑）</button>
                <button class="preset-btn" onclick="applyPreset('active')">📈 売買活発（10億↑）</button>
                <button class="preset-btn" onclick="applyPreset('prime_large')">🏛️ プライム大型</button>
                <button class="preset-btn" onclick="applyPreset('growth_small')">🌱 グロース小型</button>
                <button class="preset-btn" onclick="applyPreset('low_price')">💡 低位株（〜500円）</button>
                <button class="preset-btn" onclick="applyPreset('decline')">📉 下落株（-5%↓）</button>
            </div>

        </div>
    </div>

    <!-- 結果サマリー -->
    <div class="result-summary" id="resultSummary" style="display:none;">
        <div class="summary-container">
            <span id="summaryDate"></span>
            <strong class="summary-count" id="summaryCount"></strong>
            <span id="summaryTime"></span>
        </div>
    </div>

    <!-- ローディング -->
    <div class="loading-overlay" id="loadingOverlay" style="display:none;">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>スクリーニング実行中...</p>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="results-container">

        <!-- 初期メッセージ -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">🔍</div>
            <h2>銘柄スクリーニング</h2>
            <p>条件を設定して「スクリーニング実行」をクリックしてください</p>
            <p class="sub">J-Quants API で東証上場 約4,000銘柄を検索</p>
        </div>

        <!-- 結果テーブル -->
        <div class="table-wrapper" id="tableWrapper" style="display:none;">
            <table class="screening-table" id="resultTable">
                <thead>
                    <tr>
                        <th class="col-rank">#</th>
                        <th class="col-code">コード</th>
                        <th class="col-name">銘柄名</th>
                        <th class="col-market">市場</th>
                        <th class="col-sector">業種</th>
                        <th class="col-price sortable" data-sort="close">株価</th>
                        <th class="col-change sortable" data-sort="change_rate">前日比</th>
                        <th class="col-volume sortable" data-sort="volume">出来高</th>
                        <th class="col-turnover sortable" data-sort="turnover">売買代金</th>
                        <th class="col-range">値幅</th>
                    </tr>
                </thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>

    </div>

    <script src="/static/js/screening.js"></script>
</body>

</html>
