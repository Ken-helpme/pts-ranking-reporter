<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シグナル監視 | PTSランキング</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/signals.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ナビゲーション -->
    <header class="nav-header">
        <div class="nav-container">
            <h1 class="nav-title">📊 PTSランキング</h1>
            <nav class="nav-links">
                <a href="/" class="nav-link">📊 PTSランキング</a>
                <a href="/trending" class="nav-link">🔥 話題株</a>
                <a href="/screening" class="nav-link">🔍 スクリーニング</a>
                <a href="/signals" class="nav-link active">📡 シグナル監視</a>
                <a href="/quant" class="nav-link">🧪 クオンツ分析</a>
            </nav>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="signals-main">

        <!-- ヘッダーバー -->
        <div class="signals-header">
            <div class="signals-header-left">
                <h2>ステルス仕込みシグナル監視</h2>
                <span id="signalDate" class="signal-date"></span>
            </div>
            <button id="refreshBtn" class="btn-refresh" onclick="refreshSignals()">
                <span class="refresh-icon">↻</span> 更新
            </button>
        </div>

        <!-- サマリーカード -->
        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-label">検出中</div>
                <div class="summary-value" id="totalCount">-</div>
                <div class="summary-sub">銘柄</div>
            </div>
            <div class="summary-card summary-new">
                <div class="summary-label">新規 (5日)</div>
                <div class="summary-value" id="newCount">-</div>
                <div class="summary-sub">銘柄</div>
            </div>
            <div class="summary-card summary-ultra-early">
                <div class="summary-label">超初動</div>
                <div class="summary-value" id="ultraEarlyCount">-</div>
                <div class="summary-sub">銘柄</div>
            </div>
            <div class="summary-card summary-accel">
                <div class="summary-label">加速</div>
                <div class="summary-value" id="accelCount">-</div>
                <div class="summary-sub">銘柄</div>
            </div>
            <div class="summary-card summary-disappeared">
                <div class="summary-label">消失</div>
                <div class="summary-value" id="disappearedCount">-</div>
                <div class="summary-sub">銘柄</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">平均VB倍率</div>
                <div class="summary-value" id="avgVB">-</div>
                <div class="summary-sub">x</div>
            </div>
        </div>

        <!-- 消失アラート -->
        <div id="disappearedAlert" class="disappeared-alert" style="display:none;">
            <div class="alert-header">
                <span class="alert-icon">⚠</span>
                <span>シグナル消失銘柄</span>
                <button class="alert-toggle" onclick="toggleDisappeared()">▼</button>
            </div>
            <div id="disappearedBody" class="alert-body"></div>
        </div>

        <!-- ローディング -->
        <div id="loading" class="loading-container">
            <div class="loading-spinner"></div>
            <p>シグナルデータを読み込み中...</p>
        </div>

        <!-- エラー表示 -->
        <div id="errorBox" class="error-box" style="display:none;">
            <p id="errorMsg"></p>
        </div>

        <!-- タブ -->
        <div id="tabSection" class="tab-section" style="display:none;">
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">
                    すべて <span id="tabAllCount" class="tab-count"></span>
                </button>
                <button class="tab-btn tab-ultra-early" data-tab="ultra_early" onclick="switchTab('ultra_early')">
                    超初動 <span id="tabUltraEarlyCount" class="tab-count"></span>
                </button>
                <button class="tab-btn tab-accel" data-tab="accel" onclick="switchTab('accel')">
                    加速 <span id="tabAccelCount" class="tab-count"></span>
                </button>
                <button class="tab-btn" data-tab="new_5d" onclick="switchTab('new_5d')">
                    新規 (5日) <span id="tabNewCount" class="tab-count"></span>
                </button>
                <button class="tab-btn" data-tab="recent_10d" onclick="switchTab('recent_10d')">
                    最近 (10日) <span id="tabRecentCount" class="tab-count"></span>
                </button>
                <button class="tab-btn" data-tab="continuing" onclick="switchTab('continuing')">
                    継続中 <span id="tabContCount" class="tab-count"></span>
                </button>
            </div>

            <!-- フィルターバー -->
            <div class="filter-bar">
                <div class="filter-phases">
                    <span class="filter-label">フェーズ:</span>
                    <label class="phase-check"><input type="checkbox" value="初動" checked onchange="renderTable()"><span class="phase-dot phase-dot-early"></span>初動</label>
                    <label class="phase-check"><input type="checkbox" value="加速中" onchange="renderTable()"><span class="phase-dot phase-dot-accel"></span>加速中</label>
                    <label class="phase-check"><input type="checkbox" value="過熱" onchange="renderTable()"><span class="phase-dot phase-dot-hot"></span>過熱</label>
                </div>
                <label class="filter-toggle">
                    <input type="checkbox" id="filterHideDone" checked onchange="renderTable()">
                    <span>「済(+20%超)」非表示</span>
                </label>
                <div class="filter-days">
                    <label>継続日 ≤</label>
                    <select id="filterMaxDays" onchange="renderTable()">
                        <option value="999" selected>すべて</option>
                        <option value="3">3日</option>
                        <option value="5">5日</option>
                        <option value="10">10日</option>
                        <option value="20">20日</option>
                    </select>
                </div>
            </div>

            <!-- テーブル -->
            <div class="signal-table-wrap">
                <table class="signal-table">
                    <thead>
                        <tr>
                            <th>フェーズ</th>
                            <th class="num sortable" data-sort="days_since_detected">経過日</th>
                            <th>コード</th>
                            <th>銘柄名</th>
                            <th>業種</th>
                            <th class="num sortable" data-sort="close">株価</th>
                            <th class="num sortable" data-sort="price_vs_start">上昇率</th>
                            <th class="num sortable" data-sort="ml_score">MLスコア</th>
                            <th class="num sortable" data-sort="vol_base_ratio">VB倍率</th>
                            <th class="num sortable" data-sort="signal_days">継続日</th>
                            <th class="num">売代(億)</th>
                            <th class="num sortable" data-sort="rsi">RSI</th>
                            <th class="num">25MA乖離</th>
                            <th class="num sortable" data-sort="op_growth">営業増益</th>
                            <th class="num">EPS増益</th>
                            <th>トレンド</th>
                            <th>検知日</th>
                            <th class="chart-col">チャート (120日)</th>
                        </tr>
                    </thead>
                    <tbody id="signalBody"></tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- トースト -->
    <div id="toast" class="toast"></div>

    <script src="/static/js/signals.js"></script>
</body>

</html>
