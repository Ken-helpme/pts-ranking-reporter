name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: son-app-project
  REGION: asia-northeast1
  SERVICE: pts-ranking-reporter
  IMAGE: asia-northeast1-docker.pkg.dev/son-app-project/pts-ranking-repo/pts-ranking-reporter

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --memory=512Mi \
            --timeout=300 \
            --set-env-vars="PYTHONPATH=/app/src,ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},JQUANTS_API_KEY=${{ secrets.JQUANTS_API_KEY }}" \
            --quiet

      - name: Health check and debug
        if: always()
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "Service URL: $URL"

          # Wait for the service to start
          sleep 20

          # Test the service
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 60 "$URL/")
          echo "Health check response: HTTP $HTTP_CODE"
          echo "Response body:"
          cat /tmp/response.txt | head -20

          echo ""
          echo "=== Cloud Run Logs ==="
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.SERVICE }}" \
            --project=${{ env.PROJECT_ID }} \
            --limit=100 \
            --format='value(textPayload,jsonPayload.message)' \
            --freshness=10m 2>/dev/null | tee /tmp/cloudrun_logs.txt || echo "Could not fetch logs"

          echo ""
          echo "=== Revision Status ==="
          gcloud run revisions list \
            --service=${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --limit=5 2>/dev/null || echo "Could not list revisions"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Service is NOT healthy (HTTP $HTTP_CODE)"
            exit 1
          else
            echo "✅ Service is healthy!"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudrun-logs
          path: /tmp/cloudrun_logs.txt
          if-no-files-found: ignore
