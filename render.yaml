services:
  - type: web
    name: pts-ranking-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd dashboard && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
    plan: free
    autoDeploy: true
